<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- /vite.svg never existed in public/, so the tab has been showing the
         browser's default page icon since the project was scaffolded. The SVG
         stays sharp at 16px where a downscaled 192px PNG goes soft; the PNG is
         the fallback for anything that will not take an SVG favicon. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <!-- viewport-fit=cover is required for env(safe-area-inset-*) to report
         anything other than zero on notched devices. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Financial Reading</title>

    <!-- Installable from the browser: Android reads the manifest, iOS reads
         the apple-* tags below and ignores the manifest's display mode. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0f172a" />

    <!-- Without apple-mobile-web-app-capable, iOS opens the home-screen icon
         in Safari with its chrome instead of as a standalone app. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Financial Reading" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
